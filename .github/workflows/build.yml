name: Capture startup test build

on:
  workflow_dispatch:

jobs:
  build:
    if: github.repository == 'solid-pixel/better-shot'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build
        run: |
          set -euo pipefail
          make generate
          xcodebuild -project BetterShot.xcodeproj -scheme BetterShot -configuration Release \
            -derivedDataPath .build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { tail -100 build.log; exit 1; }
          test -d .build/Build/Products/Release/BetterShot.app
      - name: Package test app
        run: |
          ditto -c -k --sequesterRsrc --keepParent .build/Build/Products/Release/BetterShot.app BetterShot-startup-test.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BetterShot-startup-test
          path: BetterShot-startup-test.zip
          retention-days: 14
