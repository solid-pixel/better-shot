name: Capture full test suite

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'solid-pixel/better-shot'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      BETTERSHOT_TESTING: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          sw_vers
          git rev-parse HEAD
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Run complete test target
        id: full_tests
        run: |
          set -euo pipefail
          mkdir -p .build/test-logs
          make test 2>&1 | tee .build/test-logs/make-test.log
      - name: Summarize result
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.full_tests.outcome }}
        run: |
          {
            echo "## Full make test outcome: ${TEST_OUTCOME}"
            echo "Commit: $(git rev-parse HEAD)"
            echo 'Tests use BETTERSHOT_TESTING=1 with isolated storage and no real R2 Keychain access.'
            echo 'This run does not establish physical shortcut latency or multi-display hardware behavior.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BetterShot-full-test-results
          path: |
            .build/test-logs/
            .build/editor-snapshots/
          if-no-files-found: warn
          retention-days: 7
